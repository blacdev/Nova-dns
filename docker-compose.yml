# The platform: api.ROOT_DOMAIN and app.ROOT_DOMAIN behind Caddy (HTTPS from Let's
# Encrypt by itself), the worker, and PostgreSQL. coturn runs on its own host:
# deploy/turn/docker-compose.yml.
#
#   cp .env.example .env    # fill it in
#   docker compose up -d --build
name: nova-platform

# One image, built once (by migrate below) and used by every service. When each service
# had its own `build`, newer Docker Compose built them all at the same time and the
# second failed: 'image "docker.io/library/nova-platform:latest": already exists'.
x-app: &app
  image: nova-platform
  pull_policy: never
  env_file: .env
  restart: unless-stopped
  depends_on:
    migrate:
      condition: service_completed_successfully
  networks: [platform]

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nova
      POSTGRES_USER: nova
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nova -d nova"]
      interval: 5s
      retries: 20
    networks: [platform]

  migrate:
    build: .
    image: nova-platform
    env_file: .env
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks: [platform]

  api:
    <<: *app
    command: ["api"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.API_PORT||8080)+'/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s

  dashboard:
    <<: *app
    command: ["dashboard"]

  worker:
    <<: *app
    command: ["worker"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [api, dashboard]
    networks:
      platform:
        ipv4_address: 172.28.0.10

networks:
  platform:
    ipam:
      config: [{ subnet: 172.28.0.0/24 }]

volumes:
  pgdata:
  caddy_data:
