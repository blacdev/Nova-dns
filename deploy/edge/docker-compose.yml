# The tunnel's edge on its own host (Nova's docs/TUNNEL.md): stations that open no port
# dial in here over QUIC; presenters' browsers connect here and are passed down to their
# station, still encrypted. It needs a UDP port (stations) and TCP port(s) (presenters)
# forwarded straight to it, never through a reverse proxy: EDGE_QUIC and EDGE_PUBLIC in .env
# (./setup.sh edge writes them). Behind Nginx Proxy Manager, which keeps TCP 443: TCP 25433.
#
#   ./setup.sh edge              # from the repository's root: asks, tests, writes .env, starts
#   (by hand: .env with EDGE_API_BASE and the API's EDGE_TOKEN, then docker compose up -d --build)
# Firewall and router: the UDP port (stations) and the TCP port(s) (presenters).
# DNS: edge.ROOT_DOMAIN -> this host. On the platform: EDGE_IP=<this host's address>.
name: nova-edge

services:
  edge:
    build: ../../edge
    image: nova-edge
    restart: unless-stopped
    network_mode: host
    # Binding ports below 1024 as a non-root user.
    cap_add: ["NET_BIND_SERVICE"]
    env_file: .env
