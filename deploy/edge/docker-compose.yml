# The tunnel's edge on its own host (Nova's docs/TUNNEL.md): stations that open no port
# dial in here over QUIC; presenters' browsers connect here and are passed down to their
# station, still encrypted. It needs a public address and UDP 443 and TCP 443 to itself,
# so it does not share a host with Caddy (which takes TCP 443, and UDP 443 for HTTP/3).
#
#   ./setup.sh edge              # from the repository's root: asks, tests, writes .env, starts
#   (by hand: .env with EDGE_API_BASE and the API's EDGE_TOKEN, then docker compose up -d --build)
# Firewall: UDP 443 (stations), TCP 443 and TCP 25433 (presenters).
# DNS: edge.ROOT_DOMAIN -> this host. On the platform: EDGE_IP=<this host's address>.
name: nova-edge

services:
  edge:
    build: ../../edge
    image: nova-edge
    restart: unless-stopped
    network_mode: host
    # Binding ports below 1024 as a non-root user.
    cap_add: ["NET_BIND_SERVICE"]
    env_file: .env
